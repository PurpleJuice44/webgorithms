<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알고리즘 클래스 - KOI 4단계 로드맵</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<style>
  :root {
    --primary: #1d4ed8;
    --primary-light: #eff6ff;
    --border: #e5e7eb;
    --bg: #ffffff;
    --bg-sidebar: #f8fafc;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --code-bg: #f3f4f6;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); line-height: 1.65; word-break: keep-all; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 span { font-weight: 400; color: var(--text-muted); font-size: 13px; margin-left: 8px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  #search { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 200px; }
  #search:focus { outline: 2px solid var(--primary-light); border-color: var(--primary); }
  .btn { padding: 6px 10px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: var(--primary-light); }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 57px); }
  aside {
    width: 300px; flex-shrink: 0;
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    overflow-y: auto; height: calc(100vh - 57px); position: sticky; top: 57px;
  }
  main {
    flex: 1; min-width: 0; padding: 24px 32px; max-width: 860px; margin: 0 auto; width: 100%;
  }

  /* Sidebar */
  .sidebar-section { padding: 12px 12px 4px; }
  .sidebar-title {
    font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    margin: 12px 0 6px; padding: 0 8px;
  }
  .nav-item {
    display: block; padding: 7px 8px; border-radius: 6px; font-size: 13.5px; line-height: 1.4;
    color: var(--text); cursor: pointer; border: 1px solid transparent;
  }
  .nav-item:hover { background: white; border-color: var(--border); }
  .nav-item.active { background: var(--primary); color: white; border-color: var(--primary); }
  .nav-item.active .nav-meta { color: rgba(255,255,255,0.8); }
  .nav-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .level-badge {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-right: 6px; vertical-align: middle;
  }
  .level-입문 { background: #dcfce7; color: #166534; }
  .level-초급 { background: #dbeafe; color: #1e40af; }
  .level-중급 { background: #fef3c7; color: #92400e; }
  .level-고급 { background: #fee2e2; color: #991b1b; }
  .level-목차 { background: #f3f4f6; color: #374151; }

  /* Content */
  .markdown-body { font-size: 14.5px; }
  .markdown-body h1 { font-size: 26px; border-bottom: 2.5px solid #111; padding-bottom: 8px; margin-top: 0; }
  .markdown-body h2 { font-size: 18px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 32px; }
  .markdown-body h3 { font-size: 15px; color: #111; margin-top: 20px; }
  .markdown-body p, .markdown-body li { line-height: 1.7; }
  .markdown-body blockquote { border-left: 3px solid #3b82f6; margin: 16px 0; padding: 10px 14px; background: #eff6ff; border-radius: 0 6px 6px 0; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
  .markdown-body th, .markdown-body td { border: 1px solid #d1d5db; padding: 7px 10px; text-align: left; }
  .markdown-body th { background: #f3f4f6; font-weight: 600; }
  .markdown-body code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .markdown-body pre { background: #f8fafc; border: 1px solid var(--border); padding: 14px; overflow-x: auto; border-radius: 8px; }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body details { background: #fffbeb; border: 1px solid #fcd34d; padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
  .markdown-body details summary { cursor: pointer; font-weight: 600; }
  .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .markdown-body img { max-width: 100%; height: auto; display: block; margin: 12px auto; border: 1px solid var(--border); border-radius: 8px; }

  /* Mermaid */
  .mermaid { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 16px 0; text-align: center; }
  .mermaid svg { max-width: 100%; height: auto; }

  /* Mobile */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    aside { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 16px; }
    header h1 span { display: none; }
    #search { width: 130px; }
  }

  /* Loading */
  .loading { color: var(--text-muted); text-align: center; padding: 40px; }
  .error { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: 12px; border-radius: 6px; margin: 16px 0; }
</style>
</head>
<body>
<header>
  <h1>알고리즘 클래스 <span>KOI 4단계 로드맵 · 30개 파일</span></h1>
  <div class="header-actions">
    <input id="search" type="search" placeholder="검색 (제목, 키워드)">
    <button class="btn" onclick="toggleSidebar()">목차</button>
    <a class="btn" href="https://github.com" target="_blank" style="text-decoration:none;">GitHub Pages</a>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div id="nav"></div>
  </aside>
  <main id="content">
    <div class="loading">목차를 불러오는 중...</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
// Init mermaid
mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: { primaryColor: '#eff6ff', primaryTextColor: '#1e40af', lineColor: '#3b82f6' } });

let files = [];
let currentFile = null;

async function loadFiles() {
  try {
    const res = await fetch('files.json');
    files = await res.json();
  } catch (e) {
    // Fallback: try to list via directory? For local dev, use hardcoded
    console.error('files.json load failed', e);
    files = [{name: '목차.md', path: '목차.md', level: '목차', title: '목차'}];
  }
  renderNav();
  // Load initial file
  const hash = decodeURIComponent(location.hash.slice(1));
  const initial = hash || '목차.md';
  loadFile(initial);
}

function renderNav() {
  const nav = document.getElementById('nav');
  const groups = {};
  files.forEach(f => {
    if (!groups[f.level]) groups[f.level] = [];
    groups[f.level].push(f);
  });
  const order = ['목차', '입문', '초급', '중급', '고급'];
  let html = '';
  order.forEach(level => {
    if (!groups[level]) return;
    html += `<div class="sidebar-title">${level === '목차' ? '시작' : '['+level+'] ' + (level==='입문'?'기초 체력':level==='초급'?'완전탐색과 그래프 입문':level==='중급'?'최적화와 자료구조':'KOI 최고난도')}</div>`;
    groups[level].forEach(f => {
      const active = currentFile === f.path ? 'active' : '';
      const badgeClass = 'level-' + f.level;
      html += `<a class="nav-item ${active}" data-path="${encodeURIComponent(f.path)}" onclick="loadFile('${f.path.replace(/'/g, "\\'")}')">
        <span class="level-badge ${badgeClass}">${f.level}</span>${f.name.replace(/\.md$/, '')}
        <div class="nav-meta">${escapeHtml(f.title)}</div>
      </a>`;
    });
  });
  html += `<div style="padding:12px 8px; font-size:11px; color:var(--text-muted);">업데이트: 새 <code>.md</code> 추가 후<br><code>python generate_files_json.py</code> 실행</div>`;
  nav.innerHTML = html;
  filterNav(document.getElementById('search').value);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadFile(path) {
  currentFile = path;
  location.hash = encodeURIComponent(path);
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', decodeURIComponent(el.dataset.path) === path);
  });
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">불러오는 중... ' + escapeHtml(path) + '</div>';
  try {
    // GitHub Pages stores Hangul filenames as NFD (decomposed) on macOS HFS+,
    // while local files are NFC. Try both to handle 404 due to Unicode normalization.
    async function fetchWithFallback(p) {
      const candidates = [p, p.normalize('NFD'), p.normalize('NFC')];
      // Deduplicate
      const seen = new Set();
      const uniq = candidates.filter(c => { if (seen.has(c)) return false; seen.add(c); return true; });
      let lastErr = null;
      for (const cand of uniq) {
        try {
          const r = await fetch(encodeURI(cand));
          if (r.ok) return r;
          lastErr = new Error(r.status + ' ' + r.statusText + ' (' + cand + ')');
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('404');
    }
    const res = await fetchWithFallback(path);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const md = await res.text();
    // Render markdown
    const html = marked.parse(md);
    content.innerHTML = '<div class="markdown-body">' + html + '</div>';
    // Highlight code
    content.querySelectorAll('pre code').forEach(block => {
      try { hljs.highlightElement(block); } catch(e) {}
    });
    // Render mermaid
    const mermaidBlocks = content.querySelectorAll('code.language-mermaid');
    for (const block of mermaidBlocks) {
      const code = block.textContent;
      const pre = block.parentElement;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code;
      pre.replaceWith(div);
    }
    if (content.querySelectorAll('.mermaid').length > 0) {
      await mermaid.run({ querySelector: '.mermaid' });
    }
    // Intercept internal links to md files
    content.querySelectorAll('a').forEach(a => {
      const href = a.getAttribute('href');
      if (href && href.endsWith('.md')) {
        // Handle relative links like ./[입문]%20재귀.md or [입문] 재귀.md
        let target = href;
        try { target = decodeURIComponent(target); } catch(e) {}
        target = target.replace(/^\.\//, '');
        // Check if it's one of our files
        const found = files.find(f => f.path === target || f.name === target);
        if (found) {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            loadFile(found.path);
            window.scrollTo(0,0);
          });
        }
      }
    });
    window.scrollTo(0,0);
  } catch (e) {
    content.innerHTML = '<div class="error">파일을 불러올 수 없습니다: ' + escapeHtml(path) + '<br>' + escapeHtml(e.message) + '<br><br>로컬에서 직접 파일을 열면 <code>fetch</code>가 차단됩니다. <code>python -m http.server</code> 로 실행하거나 GitHub Pages에 배포 후 확인하세요.</div>';
  }
}

function toggleSidebar() {
  const aside = document.getElementById('sidebar');
  aside.style.display = aside.style.display === 'none' ? 'block' : 'none';
}

document.getElementById('search').addEventListener('input', (e) => {
  filterNav(e.target.value);
});

function filterNav(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = !q || text.includes(q) ? 'block' : 'none';
  });
}

// Handle hash change
window.addEventListener('hashchange', () => {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && hash !== currentFile) loadFile(hash);
});

loadFiles();
</script>
</body>
</html>
